name: Build lancedb-compat wheel (x86-64-v2, no AVX)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lancedb-no-avx-v1

      - name: Install maturin
        run: pip install maturin

      - name: Build lancedb wheel (x86-64-v2, NO AVX at all)
        working-directory: python
        env:
          # x86-64-v2 = Nehalem baseline (SSE4.2)
          # -avx,-avx2,-fma,-f16c = 禁止使用 VEX 编码，强制用 SSE 编码
          # 这样 J3455 (无 AVX) 也能执行所有指令
          RUSTFLAGS: "-C target-cpu=x86-64-v2 -C target-feature=-avx,-avx2,-fma,-f16c"
          CFLAGS: "-march=x86-64-v2 -mno-avx -mno-avx2 -mno-fma -mno-f16c -O2"
          CXXFLAGS: "-march=x86-64-v2 -mno-avx -mno-avx2 -mno-fma -mno-f16c -O2"
        run: maturin build --release --interpreter python3.12

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-compat-wheel
          path: target/wheels/*.whl
          retention-days: 30
